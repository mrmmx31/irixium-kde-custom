<svg xmlns="http://www.w3.org/2000/svg" width="32" height="24" viewBox="0 0 32 24" shape-rendering="crispEdges">
  <title>Three stacked rectangular program windows in the two-color lower-strip palette; action unassigned</title>
  <!-- Rear program: a one-pixel raised edge and square title controls. -->
  <rect x="12" y="1" width="17" height="13" fill="#3e536e"/>
  <rect x="12" y="1" width="16" height="12" fill="#c4d5ed"/>
  <rect x="13" y="2" width="14" height="3" fill="#3e536e"/>
  <rect x="14" y="3" width="2" height="1" fill="#c4d5ed"/>
  <rect x="25" y="3" width="1" height="1" fill="#c4d5ed"/>
  <rect x="13" y="6" width="14" height="6" fill="#3e536e"/>
  <rect x="24" y="7" width="2" height="1" fill="#c4d5ed"/>
  <rect x="24" y="9" width="2" height="1" fill="#c4d5ed"/>
  <!-- Middle program preserves the same rectilinear window construction. -->
  <rect x="8" y="5" width="17" height="13" fill="#3e536e"/>
  <rect x="8" y="5" width="16" height="12" fill="#c4d5ed"/>
  <rect x="9" y="6" width="14" height="3" fill="#3e536e"/>
  <rect x="10" y="7" width="2" height="1" fill="#c4d5ed"/>
  <rect x="21" y="7" width="1" height="1" fill="#c4d5ed"/>
  <rect x="9" y="10" width="14" height="6" fill="#3e536e"/>
  <!-- Front program has a stippled face with two short text/control rows. -->
  <rect x="3" y="9" width="18" height="14" fill="#3e536e"/>
  <rect x="3" y="9" width="17" height="13" fill="#c4d5ed"/>
  <rect x="4" y="10" width="15" height="3" fill="#3e536e"/>
  <rect x="5" y="11" width="2" height="1" fill="#c4d5ed"/>
  <rect x="9" y="11" width="5" height="1" fill="#c4d5ed"/>
  <rect x="17" y="11" width="1" height="1" fill="#c4d5ed"/>
  <rect x="5" y="15" width="2" height="1" fill="#3e536e"/>
  <rect x="9" y="15" width="8" height="1" fill="#3e536e"/>
  <rect x="5" y="17" width="2" height="1" fill="#3e536e"/>
  <rect x="9" y="17" width="6" height="1" fill="#3e536e"/>
  <rect x="5" y="20" width="1" height="1" fill="#3e536e"/>
  <rect x="7" y="20" width="1" height="1" fill="#3e536e"/>
  <rect x="9" y="20" width="1" height="1" fill="#3e536e"/>
  <rect x="11" y="20" width="1" height="1" fill="#3e536e"/>
  <rect x="13" y="20" width="1" height="1" fill="#3e536e"/>
  <rect x="15" y="20" width="1" height="1" fill="#3e536e"/>
  <rect x="17" y="20" width="1" height="1" fill="#3e536e"/>
</svg>
